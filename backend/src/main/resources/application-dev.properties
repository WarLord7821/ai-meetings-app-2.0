# Development Profile - Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ai_meeting_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=YmFzZTY0ZW5jb2RlZHNlY3JldGtleWZvcmp3dG9rZW5zZWN1cml0eTI1NjBi
jwt.expiration=86400000

# OpenRouter API Configuration
# OPENROUTER_API_KEY env var overrides the local fallback value
openrouter.api.key=${OPENROUTER_API_KEY:your-openrouter-api-key-here}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
# Base URL (no path suffix) used by OpenRouterClient for /chat/completions and
# /embeddings (RAG chat feature) — keep in sync with the host in openrouter.api.url above.
openrouter.base-url=https://openrouter.ai/api/v1
# Embedding model for RAG over meeting summaries — 1536 dimensions, ~$0.00000002/token.
openrouter.embedding-model=openai/text-embedding-3-small
# Chat models for RAG question-answering (same 3-model cap as summary generation).
openrouter.chat-model=openai/gpt-oss-120b
openrouter.chat-fallback-models=meta-llama/llama-3.3-70b-instruct,google/gemma-4-31b-it:free
# Model slugs change often — verify at https://openrouter.ai/models before editing.
# Primary is a cheap paid model (~$0.0002/summary) so requests never depend on
# free-tier availability, which is shared across all OpenRouter users and gets
# rate-limited unpredictably. Free models are kept only as later fallbacks.
# NOTE: OpenRouter's "models" routing array (primary + fallbacks) is capped at
# 3 entries total — sending more is rejected with a 400. Keep at most 2 fallbacks.
openrouter.model=openai/gpt-oss-120b
openrouter.fallback-models=meta-llama/llama-3.3-70b-instruct,google/gemma-4-31b-it:free
openrouter.max-tokens=4096
openrouter.timeout-seconds=120
openrouter.app-url=http://localhost:4200

# Server
server.port=8080

# Meeting file storage (replaces MySQL meetings table)
meetings.storage.dir=./meetings-data

# ── Stripe Configuration ────────────────────────────────────────────────────
# Test-mode keys — never commit real keys to git
stripe.secret-key=${STRIPE_SECRET_KEY:your-stripe-secret-key-here}
# ⚠️  PASTE the whsec_... value printed by `stripe listen` below — this must match or webhooks are rejected
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:your-stripe-webhook-secret-here}
stripe.pro-price-id=price_1UI4AeRplVguLDgIS7uUyxYd
stripe.credits-price-id=price_1UI4BsRplVguLDgI9ZMTY9V4
# URL of your Angular dev server — used for Stripe redirect URLs
stripe.frontend-url=http://localhost:4200