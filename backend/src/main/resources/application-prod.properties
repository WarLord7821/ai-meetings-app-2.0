# Production Profile - Oracle Cloud VM with SQLite
spring.datasource.url=jdbc:sqlite:/home/ubuntu/ai_meeting_db.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# OpenRouter API Configuration (secrets come from environment variables)
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.embedding-model=${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
openrouter.chat-model=${OPENROUTER_MODEL:openai/gpt-oss-120b}
openrouter.chat-fallback-models=${OPENROUTER_FALLBACK_MODELS:meta-llama/llama-3.3-70b-instruct,google/gemma-4-31b-it:free}
# Cheap paid model by default — free-tier models are shared across all
# OpenRouter users and get rate-limited unpredictably in production.
# NOTE: OpenRouter's "models" routing array (primary + fallbacks) is capped at
# 3 entries total — sending more is rejected with a 400. Keep at most 2 fallbacks.
openrouter.model=${OPENROUTER_MODEL:openai/gpt-oss-120b}
openrouter.fallback-models=${OPENROUTER_FALLBACK_MODELS:meta-llama/llama-3.3-70b-instruct,google/gemma-4-31b-it:free}
openrouter.max-tokens=4096
openrouter.timeout-seconds=120
openrouter.app-url=${FRONTEND_URL:http://localhost:4200}

# Stripe Configuration (required at startup — StripeConfig / BillingController)
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.pro-price-id=${STRIPE_PRO_PRICE_ID}
stripe.credits-price-id=${STRIPE_CREDITS_PRICE_ID}
stripe.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Server
server.port=8080
server.address=0.0.0.0